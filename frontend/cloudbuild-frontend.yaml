steps:
  # 1. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'frontend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:latest'
      - '.'

  # 2. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:latest'

  # 3. Deploy Frontend Service to Cloud Run with Direct VPC
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend-service'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'
      - '--ingress=internal-and-cloud-load-balancing'
      - '--network=first-project-vpc'
      - '--subnet=first-subnet'
      - '--vpc-egress=all-traffic'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY