steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:$COMMIT_SHA'
      - '.'

  # 2. Push Backend Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:$COMMIT_SHA'

  # 3. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'frontend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'
      - '.'

  # 4. Push Frontend Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'