steps:
  # 1. Build Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'backend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:latest'
      - '.'

  # 2. Push Backend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:latest'

  # 3. Build Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'frontend'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'
      - '-t'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:latest'
      - '.'

  # 4. Push Frontend Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:latest'

  # 5. Deploy Backend Service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'backend-service'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--add-cloudsql-instances=$PROJECT_ID:asia-south1:gcp-learning-cloud-sql'
      - '--remove-env-vars=POSTGRES_PASSWORD'
      - '--update-env-vars=DB_HOST=/cloudsql/$PROJECT_ID:asia-south1:gcp-learning-cloud-sql,POSTGRES_DB=postgres,POSTGRES_USER=postgres,REDIS_HOST=127.0.0.1,REDIS_PORT=6379'
      - '--set-secrets=POSTGRES_PASSWORD=postgres-password:latest'

  # 6. Deploy Frontend Service to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'frontend-service'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-backend/backend:$COMMIT_SHA'
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/learn-gcp-repo-frontend/frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY